[package]
name = "clearmic-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
clearmic-dsp = { path = "../clearmic-dsp" }
cpal = { version = "0.18.2", features = ["realtime"] }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
ringbuf = "0.5.3"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm"] }
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Console","Win32_System_Com", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
tray-icon = "0.26.1"
